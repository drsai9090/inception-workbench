name: inception-workbench
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: inception
      POSTGRES_USER: inception
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting this synthetic database}
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - inception-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inception -d inception"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  inception-postgres:
